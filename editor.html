<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/editor.css"/>
    <title>Code Editor</title>
</head>
<body>
    <header>
        <div class="container row">
            <div class="brand">
                <div class="logo"> </div>
                <div class="title"> Code Editor</div>
            </div>
            <div class ="row">
                <button class ="btn secondary" id ="saveBtn" title ="Save Work locally"><span>Save</span></button>
                <button class ="btn secondary" id = "loadBtn" title ="Load Work from device"><span>Load</span></button>
                <input id="openFile" tpye="file" accept="application/json" hidden/>

            </div>

        </div>

    </header>
    <main>
        <aside class="card stack panel">
            <h2> Tasks</h2>
            <textarea id="assignment" class="text" placeholder="task description"> </textarea>
            <div class="stack">
                <label for ="testArea"> Validation tests</label>
                <textarea id ="testArea" name="testArea" class="text" placeholder="Write tests here"></textarea>
            </div>
            <div class="muted">
                Tip : <span class="kbd"> Ctrl</span> + <span class="kbd"> S</span> to save,
                <span class="kbd"> Ctrl</span> + <span class="kbd"> Enter</span> to run 

            </div>
        </aside>
        <section class="stack" id="web-only">
            <div id="WebEditor" class="stack panel card">
                <div class="row">
                    <h2> Editor Panel</h2>
                    <div class="row">
                        <button class="btn ok" id="runWeb">Run</button>
                        <button class="btn secondary" id="openPreview"> Open in new window</button>

                   </div>
                </div>
                    <div class="tabs" id="webTabs" role="tablist" aria-label="web editors">
                        <button class="tab active" role="tab" aria-selected="true" tabindex="0" data-pane="html"> HTML</button>
                        <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-pane="css"> CSS</button>
                        <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-pane="js"> JS</button>
        
                    </div>
                    <div class="editor-wrap" data-pane="html">
                        <div id="ed_html" class="editor">

                        </div>
                    </div>
                    <div class="editor-wrap" data-pane="css" hidden>
                        <div id="ed_css" class="editor">
                            
                        </div>
                    </div>
                    <div class="editor-wrap" data-pane="js" hidden>
                        <div id="ed_js" class="editor">
                            
                        </div>
                    </div>
                    <div class="stack" >
                        <h3> Preview</h3>
                        <iframe id="preview" class="preview" sandbox="allow-same-origin allow-scripts allow-modals allow-forms">
                            
                        </iframe>
                    </div>

                
            
          </div>
        </section>
        <aside class="stack panel card" >
            <div class="out" id="output" aria-live="polite"> </div>
                <div class="row">
                    <button class="btn warn" id="runTests">Run with Tests</button>
                    <button class="btn err" id="clearLogs"> Clear Logs</button>
                </div>
                <h3>Notes</h3>
                <ul class="muted">
                    <li>Everything runs inside the browser is in the sandbox</li>
                    <li> You can save the work as json file and restore it later on</li>

                </ul>

          
        </aside>
        <footer>

        
    </main>
    <div class="footer">
        <h4> Copyrights &copy; reserved 2026</h4>
    </div>
    <script
    src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ace.js"
    integrity="sha512-ZIa+FlPaGDSM+lTl9JaxnQvcfma7ETsOHd9Thbhp5u4RX1uYiDNW7XvUrXv4dJSPetXbiTzWilHEkSg4YpmltQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    onerror="(function(){var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/ace-builds@1.43.2/src-min/ace.js'; document.head.appendChild(s);}())">
  </script>
    <script src="js/editor.js"></script>
</body>
</html>
